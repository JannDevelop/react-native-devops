name: React Native CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    name: 1. Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Чтение кода из GitHub
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов (TypeScript)
        run: npx tsc --noEmit || echo "Проверка типов завершилась (добавьте tsc при необходимости)"

      - name: Запуск тестов (Jest)
        run: npm test -- --passWithNoTests

  build-android:
    name: 2. Build Android APK
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Чтение кода из GitHub
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Установка Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Gradle (Кэширование для ускорения)
        uses: gradle/actions/setup-gradle@v3

      - name: Установка зависимостей Node
        run: npm ci

      - name: Сборка Android APK (APK для проверки)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Сохранение готового APK в GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
name: React Native (Expo) CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    name: 1. Lint & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Чтение кода из GitHub
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Безопасный запуск тестов
        run: npm run test --if-present -- --passWithNoTests

  build-android:
    name: 2. Build Expo Android APK
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Чтение кода из GitHub
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Настройка Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установка зависимостей Node
        run: npm ci

      - name: Генерация нативного кода (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: Сборка Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Сохранение готового APK в GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk